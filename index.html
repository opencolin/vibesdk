<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="alternate icon" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://cdnjs.cloudflare.com https://cdn.tailwindcss.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' wss: ws: http: https:; frame-src 'self' http://*.localhost:* https://*;" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Caveat:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
		<title>vibesdk — Build apps with AI</title>
		<meta name="description" content="Open-source agent platform. Bring an idea, ship a v1." />
		<meta name="theme-color" content="#052b42" />
		<script>
			// Anti-flash: apply theme class to <html> before paint so the first frame
			// matches the user's saved preference (or dark by default for unset).
			(function () {
				try {
					var saved = localStorage.getItem('theme');
					var resolved =
						saved === 'light' ? 'light'
						: saved === 'system'
							? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
							: 'dark';
					document.documentElement.classList.add(resolved);
				} catch (_) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
